[env:ttgo-lolin32]
board = esp32dev
build_flags = 
  ${env.build_flags}
  -D HASP_USE_SPI_TFT=1
  -D TFT_WIDTH=480
  -D TFT_HEIGHT=320
  -D TFT_ROTATION=0
  -D TFT_BCKL=33
  -D TFT_CS=5
  -D TFT_DC=27
  -D TFT_RST=-1
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_MISO=19
  -D TOUCH_CS=14
  -D HASP_USE_LGFX_TOUCH=1
  -D USER_SETUP_LOADED
lib_deps =
  ${env.lib_deps}
  bodmer/TFT_eSPI@^2.5.33
