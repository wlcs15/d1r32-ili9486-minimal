[env:d1r32_ili9486]
platform = espressif32
board = wemos_d1_uno32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, colorize
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -I${PROJECT_DIR}
    -D CORE_DEBUG_LEVEL=4
    -D USER_SETUP_LOADED=1
    -D ILI9486_DRIVER=1
    -D TFT_WIDTH=480
    -D TFT_HEIGHT=320
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=27
    -D TFT_RST=-1
    -D TFT_BCKL=33
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D USE_HSPI_PORT=1
    -D SUPPORT_TRANSACTIONS=1
