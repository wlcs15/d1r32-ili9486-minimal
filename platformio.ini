[env:d1r32_ili9486]
platform = espressif32
board = wemos_d1_uno32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, colorize
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -D CORE_DEBUG_LEVEL=4
    -D USER_SETUP_LOADED=1
    -include "user_setups/setup_ttgo_lolin32.h"  
    -D ILI9486_DRIVER=1
    -D TFT_WIDTH=480
    -D TFT_HEIGHT=320
    -D TFT_ROTATION=1
    -D SPI_FREQUENCY=27000000
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_MOSI=23
    -D TFT_MISO=19
    -D TFT_SCLK=18
    -D TOUCH_CS=21
    -D TFT_BL=13
    -D RPI_DISPLAY_TYPE=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D SMOOTH_FONT=1
    -D SUPPORT_TRANSACTIONS=1
    
